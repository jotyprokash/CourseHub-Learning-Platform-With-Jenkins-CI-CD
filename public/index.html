<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerkPoint Coffee Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #8B4513; text-align: center; }
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .menu-item { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .menu-item h3 { margin: 0 0 10px 0; }
        .price { color: #8B4513; font-weight: bold; }
        .carousel { margin: 20px 0; }
        .carousel img { border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to PerkPoint</h1>
        <p>Your favorite coffee shop for premium brews and pastries.</p>
        
        <!-- Image Carousel -->
        <div class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="assets/landing.png" alt="Coffee Shop Interior" style="width: 100%; max-height: 400px; object-fit: cover;">
                </div>
            </div>
        </div>
        
        <h2>Our Menu</h2>
        <div id="menu" class="menu">
            <!-- Menu items will be loaded here -->
        </div>
    </div>

    <script>
        // Load menu items
        async function loadMenu() {
            try {
                const response = await fetch('/api/menu');
                const menu = await response.json();
                const menuDiv = document.getElementById('menu');
                menuDiv.innerHTML = menu.map(item => `
                    <div class="menu-item">
                        <h3>${item.name}</h3>
                        <p class="price">$${item.price.toFixed(2)}</p>
                        <p>${item.category}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading menu:', error);
            }
        }

        loadMenu();
    </script>

    <!-- Auth Modals -->
    <div id="authModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div class="modal-content" style="background: white; margin: 15% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px;">
            <span class="close" style="float: right; cursor: pointer; font-size: 28px;">&times;</span>
            <div id="loginForm">
                <h2>Login</h2>
                <form id="login">
                    <input type="email" name="email" placeholder="Email" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    <button type="submit" style="width: 100%; padding: 10px; background: #8B4513; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
                </form>
                <p><a href="#" id="showRegister">Don't have an account? Register</a></p>
            </div>
            <div id="registerForm" style="display: none;">
                <h2>Register</h2>
                <form id="register">
                    <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    <input type="email" name="email" placeholder="Email" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                    <button type="submit" style="width: 100%; padding: 10px; background: #8B4513; color: white; border: none; border-radius: 4px; cursor: pointer;">Register</button>
                </form>
                <p><a href="#" id="showLogin">Already have an account? Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
