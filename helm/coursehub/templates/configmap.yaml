apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coursehub.fullname" . }}-config
  namespace: {{ .Values.namespace }}
data:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  DB_HOST: "postgres-svc"
  DB_PORT: "5432"
  NEXT_PUBLIC_API_URL: {{ printf "http://%s/api" .Values.ingress.hosts.backend | quote }}
